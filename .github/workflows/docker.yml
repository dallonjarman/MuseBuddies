name: Docker

# One build per commit:
#   - pull requests: test, build for amd64 + arm64, smoke-test, but never publish
#   - main and v* tags: the same, then publish to ghcr.io
#   - weekly: rebuild main to pick up security fixes in the base image
# Changes that can't affect the image (docs, README, the Pages workflow) don't trigger a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: # tag pushes always build; path filters don't apply to them
      - "README.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - ".github/dependabot.yml"
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # 1. Build the amd64 image locally and prove it works before anything is published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: musebuddies:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 -e PUBLIC_URL=http://localhost:8787 musebuddies:smoke
          trap 'docker logs smoke || true' EXIT
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          curl -fsS http://localhost:8787/healthz
          curl -fsS http://localhost:8787/ | grep -q "MuseBuddies"
          curl -fsS http://localhost:8787/skill.md | grep -q "http://localhost:8787/install.sh"
          curl -fsS -o /dev/null http://localhost:8787/client.tar.gz
          curl -fsS -o /dev/null http://localhost:8787/self-host.md
          curl -fsSI http://localhost:8787/docker-compose.yml | grep -qi '^content-disposition: attachment'
          curl -fsS -X POST http://localhost:8787/v1/inboxes | grep -q '"inboxId"'
          # The relay must not run as root.
          test "$(docker exec smoke sh -c 'grep ^Uid: /proc/1/status | cut -f2')" != 0
          # SIGTERM must reach the relay and stop it promptly (no 10s kill).
          start=$(date +%s); docker stop smoke >/dev/null; took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"; test "$took" -lt 8
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
          trap - EXIT

      # 2. Build every platform (reusing the cache from step 1) and publish outside pull requests.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ env.PLATFORMS }}${{ github.event_name != 'pull_request' && ' and publish' || '' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
